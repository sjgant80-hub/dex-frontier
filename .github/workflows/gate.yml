name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests of every kernel and tool
        run: node --test test/*.test.mjs
      - name: mutation gate over the kernels (no unreviewed survivors)
        run: node witness-all.mjs
      - name: the vendored kernels are byte-identical to living-seed's
        run: node tools/vendor-check.mjs
      - name: organ 1, one specialist body (re-grown, re-scored, re-judged, seal first; the seal alone while it is being asked)
        run: |
          if [ -f data/organ-1/record.json ]; then node tools/measure-1.mjs --check && node tools/judge-1.mjs --check && node tools/order.mjs --organ 1; else test -f data/organ-1/prereg.json && echo "organ 1 sealed, being asked"; fi
      - name: organ 2, the composition proof (re-grown, re-coupled, re-scored, re-judged, seal first)
        run: |
          if [ -f data/organ-2/record.json ]; then node tools/measure-2.mjs --check && node tools/judge-2.mjs --check && node tools/order.mjs --organ 2; else test -f data/organ-2/prereg.json && echo "organ 2 sealed, being asked"; fi
