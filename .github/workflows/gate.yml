name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit tests of every kernel and tool
        run: node --test test/*.test.mjs
      - name: mutation gate over the kernels (no unreviewed survivors)
        run: node witness-all.mjs
      - name: the vendored kernels are byte-identical to living-seed's
        run: node tools/vendor-check.mjs
      - name: the credit CSV is the publisher's .xls, re-derived byte for byte
        run: node tools/convert-credit.mjs --check
      - name: organ 1, one specialist body (re-grown, re-scored, re-judged, seal first; the seal alone while it is being asked)
        run: |
          if [ -f data/organ-1/record.json ]; then node tools/measure-1.mjs --check && node tools/judge-1.mjs --check && node tools/order.mjs --organ 1; else test -f data/organ-1/prereg.json && echo "organ 1 sealed, being asked"; fi
      - name: organ 2, the composition proof (re-grown, re-coupled, re-scored, re-judged, seal first)
        run: |
          if [ -f data/organ-2/record.json ]; then node tools/measure-2.mjs --check && node tools/judge-2.mjs --check && node tools/order.mjs --organ 2; else test -f data/organ-2/prereg.json && echo "organ 2 sealed, being asked"; fi
      - name: the page says what the records say (every number and result-dependent sentence generated), and its AI layer too
        run: node tools/words.mjs --check && node tools/geo.mjs --check
      - name: the page's security policy pins exactly its scripts, and lets it connect nowhere but its own site
        run: node tools/csp.mjs --check
      - name: organ 2b (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-2b/record.json ]; then node tools/measure-2b.mjs --check && node tools/judge-2b.mjs --check && node tools/order.mjs --organ 2b; elif [ -f data/organ-2b/prereg.json ]; then echo "organ 2b sealed, being measured"; else echo "organ 2b built, not yet sealed"; fi
      - name: organ 3 (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-3/record.json ]; then node tools/measure-3.mjs --check && node tools/judge-3.mjs --check && node tools/order.mjs --organ 3; elif [ -f data/organ-3/prereg.json ]; then echo "organ 3 sealed, being measured"; else echo "organ 3 built, not yet sealed"; fi
      - name: organ 4 (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-4/record.json ]; then node tools/measure-4.mjs --check && node tools/judge-4.mjs --check && node tools/order.mjs --organ 4; elif [ -f data/organ-4/prereg.json ]; then echo "organ 4 sealed, being measured"; else echo "organ 4 built, not yet sealed"; fi
      - name: organ 5 (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-5/record.json ]; then node tools/measure-5.mjs --check && node tools/judge-5.mjs --check && node tools/order.mjs --organ 5; elif [ -f data/organ-5/prereg.json ]; then echo "organ 5 sealed, being measured"; else echo "organ 5 built, not yet sealed"; fi
      - name: organ 6 (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-6/record.json ]; then node tools/measure-6.mjs --check && node tools/judge-6.mjs --check && node tools/order.mjs --organ 6; elif [ -f data/organ-6/prereg.json ]; then echo "organ 6 sealed, being measured"; else echo "organ 6 built, not yet sealed"; fi
      - name: organ 7 (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-7/record.json ]; then node tools/measure-7.mjs --check && node tools/judge-7.mjs --check && node tools/order.mjs --organ 7; elif [ -f data/organ-7/prereg.json ]; then echo "organ 7 sealed, being measured"; else echo "organ 7 built, not yet sealed"; fi
      - name: the trace of a real case on the page is the run itself
        run: |
          if [ -f data/trace.json ]; then node tools/trace.mjs --check; else echo "no trace yet"; fi
      - name: organ 2c (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-2c/record.json ]; then node tools/measure-2c.mjs --check && node tools/judge-2c.mjs --check && node tools/order.mjs --organ 2c; elif [ -f data/organ-2c/prereg.json ]; then echo "organ 2c sealed, being measured"; else echo "organ 2c built, not yet sealed"; fi
      - name: organ 2d (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-2d/record.json ]; then node tools/measure-2d.mjs --check && node tools/judge-2d.mjs --check && node tools/order.mjs --organ 2d; elif [ -f data/organ-2d/prereg.json ]; then echo "organ 2d sealed, being measured"; else echo "organ 2d built, not yet sealed"; fi
      - name: organ 2e (re-derived, re-judged, seal first, once it is measured; nothing until it is sealed)
        run: |
          if [ -f data/organ-2e/record.json ]; then node tools/measure-2e.mjs --check && node tools/judge-2e.mjs --check && node tools/order.mjs --organ 2e; elif [ -f data/organ-2e/prereg.json ]; then echo "organ 2e sealed, being measured"; else echo "organ 2e built, not yet sealed"; fi
      - name: organ 2f, the gate retaken in full on fresh cases (re-derived, re-judged, seal first, once it is measured)
        run: |
          if [ -f data/organ-2f/record.json ]; then node tools/measure-2f.mjs --check && node tools/judge-2f.mjs --check && node tools/order.mjs --organ 2f; elif [ -f data/organ-2f/prereg.json ]; then echo "organ 2f sealed, being measured"; else echo "organ 2f built, not yet sealed"; fi
      - name: organ 2g, the gate taken again with its measurement fixed (re-derived, re-judged, seal first, once it is measured)
        run: |
          if [ -f data/organ-2g/record.json ]; then node tools/measure-2g.mjs --check && node tools/judge-2g.mjs --check && node tools/order.mjs --organ 2g; elif [ -f data/organ-2g/prereg.json ]; then echo "organ 2g sealed, being measured"; else echo "organ 2g built, not yet sealed"; fi
      - name: organ 2h, the gate taken again with the join rule fixed (re-derived, re-judged, seal first, once it is measured)
        run: |
          if [ -f data/organ-2h/record.json ]; then node tools/measure-2h.mjs --check && node tools/judge-2h.mjs --check && node tools/order.mjs --organ 2h; elif [ -f data/organ-2h/prereg.json ]; then echo "organ 2h sealed, being measured"; else echo "organ 2h built, not yet sealed"; fi
      - name: the check made after organ 2g was judged (the hospital with every department kept) is the run itself
        run: |
          if [ -f data/organ-2g/nobar.json ]; then node tools/nobar-2g.mjs --check; else echo "no check yet"; fi
      - name: the check made after organ 2f was judged (could any model here pass its frontier test?) is the run itself
        run: |
          if [ -f data/organ-2f/ceiling.json ]; then node tools/ceiling-2f.mjs --check; else echo "no check yet"; fi
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the diagnosis of the gap (FIT and GATE only, TEST never read) is the run itself
        run: node tools/diagnose.mjs --check
      - name: the diagnosis after organ 2f, on all four datasets (FIT and GATE only, TEST never read) is the run itself
        run: node tools/diagnose-2.mjs --check
      - name: the first body study (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/study-body.json ]; then node tools/study-body.mjs --check; else echo "no study yet"; fi
      - name: the second body study (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/study-body-2.json ]; then node tools/study-body-2.mjs --check; else echo "no study yet"; fi
      - name: the third body study, paired rules (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/study-body-3.json ]; then node tools/study-body-3.mjs --check; else echo "no study yet"; fi
      - name: the diagnosis after organ 2g, hospital and credit with no bar (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/diagnose-3.json ]; then node tools/diagnose-3.mjs --check; else echo "no diagnosis yet"; fi
      - name: the diagnosis after organ 2h, what one score carries and whether a relay wins it back (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/diagnose-4.json ]; then node tools/diagnose-4.mjs --check; else echo "no diagnosis yet"; fi
      - name: the relay with grown bodies (FIT and GATE only, TEST never read) is the run itself
        run: |
          if [ -f data/diagnose-5.json ]; then node tools/diagnose-5.mjs --check; else echo "no diagnosis yet"; fi
